name: Google Foundation Validation

on:
  pull_request:
    paths:
      - ".github/workflows/google-foundation-validation.yml"
      - ".config/dotnet-tools.json"
      - ".gitignore"
      - "Directory.Build.props"
      - "global.json"
      - "Xamarin.Google.sln"
      - "*.cake"
      - "icons/googleiosmaps_128x128.png"
      - "icons/googleiosplaces_128x128.png"
      - "source/AssemblyInfo.cs"
      - "source/Google/Maps/**"
      - "source/Google/Places/**"
      - "tests/E2E/Google.Foundation/**"
      - "tools/ci/select-xcode.sh"
      - "tools/e2e/check-consumer-shapes.sh"
      - "tools/e2e/check-package-structure.sh"
      - "tools/e2e/check-offline-build.sh"
      - "tools/e2e/run-google-foundation.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-foundation-validation.yml"
      - ".config/dotnet-tools.json"
      - ".gitignore"
      - "Directory.Build.props"
      - "global.json"
      - "Xamarin.Google.sln"
      - "*.cake"
      - "icons/googleiosmaps_128x128.png"
      - "icons/googleiosplaces_128x128.png"
      - "source/AssemblyInfo.cs"
      - "source/Google/Maps/**"
      - "source/Google/Places/**"
      - "tests/E2E/Google.Foundation/**"
      - "tools/ci/select-xcode.sh"
      - "tools/e2e/check-consumer-shapes.sh"
      - "tools/e2e/check-package-structure.sh"
      - "tools/e2e/check-offline-build.sh"
      - "tools/e2e/run-google-foundation.sh"
  workflow_dispatch:

# Cancel superseded PR validation; keep every main and manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  places:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    # Fork pull requests never reach it.
    runs-on: [self-hosted, macOS, ARM64, xcode-27.1]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: tools/ci/select-xcode.sh 27.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack Google.Places
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.Places

      - name: Package structure checks
        run: >-
          tools/e2e/check-package-structure.sh
          --target Places
          --package-dir output

      - name: Direct and transitive consumer checks
        run: >-
          tools/e2e/check-consumer-shapes.sh
          --target Places
          --package-dir output

      - name: Offline build proof
        run: >-
          tools/e2e/check-offline-build.sh
          --target Places
          --package-dir output

      - name: Simulator E2E
        run: >-
          tools/e2e/run-google-foundation.sh
          --target Places
          --package-dir output
          --configuration Debug

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: google-foundation-places-diagnostics
          path: tests/E2E/Google.Foundation/artifacts/
          if-no-files-found: ignore

  maps:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    # Fork pull requests never reach it.
    runs-on: [self-hosted, macOS, ARM64, xcode-27.1]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: tools/ci/select-xcode.sh 27.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack Google.Maps
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.Maps

      - name: Package structure checks
        run: >-
          tools/e2e/check-package-structure.sh
          --target Maps
          --package-dir output

      - name: Direct and transitive consumer checks
        run: >-
          tools/e2e/check-consumer-shapes.sh
          --target Maps
          --package-dir output

      - name: Offline build proof
        run: >-
          tools/e2e/check-offline-build.sh
          --target Maps
          --package-dir output

      - name: Simulator E2E
        run: >-
          tools/e2e/run-google-foundation.sh
          --target Maps
          --package-dir output
          --configuration Debug

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: google-foundation-maps-diagnostics
          path: tests/E2E/Google.Foundation/artifacts/
          if-no-files-found: ignore
