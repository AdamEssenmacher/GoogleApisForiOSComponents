name: Google Foundation Validation

# Native validation runs after merge on main, or for any branch through a manual run, so pull
# requests never queue the self-hosted Mac.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-foundation-validation.yml"
      - ".config/dotnet-tools.json"
      - ".gitignore"
      - "Directory.Build.props"
      - "global.json"
      - "Xamarin.Google.sln"
      - "*.cake"
      - "icons/googleiosmaps_128x128.png"
      - "icons/googleiosplaces_128x128.png"
      - "source/AssemblyInfo.cs"
      - "source/Google/Maps/**"
      - "source/Google/Places/**"
      - "tests/E2E/Google.Foundation/**"
      - "tools/ci/select-xcode.sh"
      - "tools/e2e/check-consumer-shapes.sh"
      - "tools/e2e/check-package-structure.sh"
      - "tools/e2e/check-offline-build.sh"
      - "tools/e2e/run-google-foundation.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      maps: ${{ steps.plan.outputs.maps }}
      places: ${{ steps.plan.outputs.places }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: CI planner regression tests
        run: |
          python3 -m unittest discover -s tests/ci -v
          dotnet test scripts/FirebaseBindingAudit.Tests/FirebaseBindingAudit.Tests.csproj --nologo
        env:
          MSBuildEnableWorkloadResolver: 'false'
      - name: Select changed foundation components
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=()
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--manual)
          elif [[ -n "$BASE_SHA" ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/ci/plan-google-foundation.py "${args[@]}"

  places:
    needs: plan
    if: needs.plan.outputs.places == 'true'
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    runs-on: [self-hosted, macOS, ARM64, xcode-27.1]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: tools/ci/select-xcode.sh 27.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack Google.Places
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.Places

      - name: Package structure checks
        run: >-
          tools/e2e/check-package-structure.sh
          --target Places
          --package-dir output

      - name: Direct and transitive consumer checks
        run: >-
          tools/e2e/check-consumer-shapes.sh
          --target Places
          --package-dir output

      - name: Offline build proof
        run: >-
          tools/e2e/check-offline-build.sh
          --target Places
          --package-dir output

      - name: Simulator E2E
        run: >-
          tools/e2e/run-google-foundation.sh
          --target Places
          --package-dir output
          --configuration Debug

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: google-foundation-places-diagnostics
          path: tests/E2E/Google.Foundation/artifacts/
          if-no-files-found: ignore

  maps:
    needs: plan
    if: needs.plan.outputs.maps == 'true'
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    runs-on: [self-hosted, macOS, ARM64, xcode-27.1]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: tools/ci/select-xcode.sh 27.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install .NET iOS workload
        run: |
          dotnet workload install ios
          dotnet workload list

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack Google.Maps
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.Maps

      - name: Package structure checks
        run: >-
          tools/e2e/check-package-structure.sh
          --target Maps
          --package-dir output

      - name: Direct and transitive consumer checks
        run: >-
          tools/e2e/check-consumer-shapes.sh
          --target Maps
          --package-dir output

      - name: Offline build proof
        run: >-
          tools/e2e/check-offline-build.sh
          --target Maps
          --package-dir output

      - name: Simulator E2E
        run: >-
          tools/e2e/run-google-foundation.sh
          --target Maps
          --package-dir output
          --configuration Debug

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: google-foundation-maps-diagnostics
          path: tests/E2E/Google.Foundation/artifacts/
          if-no-files-found: ignore
