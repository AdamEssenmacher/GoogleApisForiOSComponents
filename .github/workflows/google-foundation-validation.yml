name: Google Foundation Validation

on:
  pull_request:
    paths:
      - ".github/workflows/google-foundation-validation.yml"
      - ".config/dotnet-tools.json"
      - ".gitignore"
      - "Directory.Build.props"
      - "global.json"
      - "Xamarin.Google.sln"
      - "*.cake"
      - "icons/googleiosplaces_128x128.png"
      - "source/AssemblyInfo.cs"
      - "source/Google/Places/**"
      - "tests/E2E/Google.Foundation/**"
      - "tools/e2e/check-consumer-shapes.sh"
      - "tools/e2e/run-google-foundation.sh"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google-foundation-validation.yml"
      - ".config/dotnet-tools.json"
      - ".gitignore"
      - "Directory.Build.props"
      - "global.json"
      - "Xamarin.Google.sln"
      - "*.cake"
      - "icons/googleiosplaces_128x128.png"
      - "source/AssemblyInfo.cs"
      - "source/Google/Places/**"
      - "tests/E2E/Google.Foundation/**"
      - "tools/e2e/check-consumer-shapes.sh"
      - "tools/e2e/run-google-foundation.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  places:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcode-select -p

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET workload
        run: dotnet workload restore source/Google/Places/Places.csproj

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Pack Google.Places
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.Places

      - name: Resolve packed package version
        id: package
        shell: zsh
        run: |
          matches=(output/AdamE.Google.iOS.Places.*.nupkg(N))
          packages=()
          for package in "${matches[@]}"; do
            [[ "$package" == *.symbols.nupkg ]] || packages+=("$package")
          done
          if (( ${#packages[@]} != 1 )); then
            print -u2 -- "Expected exactly one packed Google.Places package; found ${#packages[@]}."
            printf '  %s\n' "${packages[@]}" >&2
            exit 1
          fi
          package_name="${packages[1]:t}"
          package_version="${${package_name#AdamE.Google.iOS.Places.}%.nupkg}"
          print -r -- "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Direct and transitive consumer checks
        run: >-
          tools/e2e/check-consumer-shapes.sh
          --target Places
          --package-dir output
          --package-version "${{ steps.package.outputs.version }}"

      - name: Simulator E2E
        run: >-
          tools/e2e/run-google-foundation.sh
          --target Places
          --package-dir output
          --configuration Debug
          --package-version "${{ steps.package.outputs.version }}"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: google-foundation-validation-diagnostics
          path: tests/E2E/Google.Foundation/artifacts/
          if-no-files-found: ignore
