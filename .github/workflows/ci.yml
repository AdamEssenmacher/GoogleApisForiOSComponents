name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      names:
        description: "Cake --names (comma-separated)"
        required: false
        default: "Google.SignIn"

# Cancel superseded PR validation; keep every main and manual run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Release tooling tests
        run: python3 -m unittest discover -s tests/firebase-release -v

      - name: Install emulator runner test shell
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh

      - name: Consumer emulator runner regressions
        run: python3 -m unittest discover -s tests/E2E/Firebase.Foundation -p 'test_*.py'

      - name: Firebase binding audit and fingerprint unit tests
        run: dotnet test scripts/FirebaseBindingAudit.Tests/FirebaseBindingAudit.Tests.csproj --nologo

  pack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    env:
      CAKE_NAMES: ${{ inputs.names || 'Google.SignIn' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore .NET workloads
        run: dotnet workload restore Xamarin.Google.sln

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          pod --version

      - name: Restore tools
        run: dotnet tool restore

      - name: Build + pack
        run: dotnet tool run dotnet-cake -- --target=nuget --names="${CAKE_NAMES}"

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: nuget
          path: output/*.nupkg
