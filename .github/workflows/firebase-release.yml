name: Firebase CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests only plan. Native validation runs after merge on main, or for any branch through a
# manual run, so updating a PR branch never queues the self-hosted Mac.
# Cancel superseded PR runs, but never cancel a main release candidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      relevant: ${{ steps.plan.outputs.relevant }}
      eligible: ${{ steps.plan.outputs.eligible }}
      runner: ${{ steps.plan.outputs.runner }}
      xcode: ${{ steps.plan.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Export Firebase dependency closure
        run: dotnet tool run dotnet-cake -- --target=firebase-publish-metadata
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests/firebase-release -v
      # MSBuild fixtures needing no Xcode or iOS workload, so they gate pull requests here
      # instead of waiting for the Mac. The cache-recovery suite additionally downloads the
      # pinned upload-symbols source, which would put raw.githubusercontent.com in the path of
      # the required pull request check; leave it to main and manual runs, where an outage
      # there cannot block review.
      - name: Crashlytics upload integrity tests
        env:
          CRASHLYTICS_SKIP_NETWORK_TESTS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python3 -m unittest discover -s tests/crashlytics -p 'test_*.py'
      - name: Plan validation and release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=(--online)
          if [[ "$EVENT_NAME" == push ]]; then
            # Compare with the last commit that passed validation, so a failed run stays in range.
            BASE_SHA=$(python3 scripts/firebase-release/release.py last-validated)
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--manual)
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/firebase-release/release.py plan "${args[@]}"
      - name: Check existing feed payloads before native builds
        if: steps.plan.outputs.eligible == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/firebase-release/release.py check-feeds
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firebase-plan
          path: |
            output/firebase-plan.json
            output/firebase-metadata.json
            output/firebase-feed-check.json
          if-no-files-found: error
          retention-days: 90

  validate:
    needs: plan
    if: needs.plan.outputs.relevant == 'true' && github.event_name != 'pull_request'
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    runs-on: [self-hosted, macOS, ARM64, '${{ needs.plan.outputs.runner }}']
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      XCODE_VERSION: ${{ needs.plan.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: firebase-plan
          path: output
      - name: Select configured Xcode
        run: tools/ci/select-xcode.sh "$XCODE_VERSION"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install build and emulator tools
        run: |
          dotnet tool restore
          dotnet workload install ios maccatalyst
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods
          fi
          npm install --global firebase-tools@15.28.2
      - name: Unit tests
        id: unit-tests
        run: |
          dotnet test scripts/FirebaseBindingAudit.Tests/FirebaseBindingAudit.Tests.csproj --nologo
          python3 -m unittest discover -s tests/E2E/Firebase.Foundation -p 'test_*.py'
      - name: Verify feed read access
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/firebase-release/release.py probe-feeds
      - name: Build and pack the complete Firebase closure
        shell: bash
        run: |
          names=$(python3 -c 'import json; print(",".join(p["key"] for p in json.load(open("output/firebase-metadata.json")) if p["firebase"]))')
          dotnet tool run dotnet-cake -- --target=nuget --names="$names"
      - name: Inspect and stage the effective package set
        id: package-inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/firebase-release/release.py prepare --online
      - name: Sequential consumer and emulator validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/firebase-results
          lane() {
            name="$1"; shift
            tools/e2e/run-firebase-foundation.sh --package-dir output/firebase-candidate --configuration Debug "$@"
            cp tests/E2E/Firebase.Foundation/artifacts/firebase-foundation-result.json "output/firebase-results/$name.json"
            cp tests/E2E/Firebase.Foundation/artifacts/firebase-foundation-sim.log "output/firebase-results/$name.log"
          }
          lane smoke
          lane surface --binding-surface-target all
          lane nullability --enable-nullability-validation
          lane firestore-pipeline --runtime-drift-case cloudfirestore-pipeline-bridges
          lane firestore-aggregate --runtime-drift-case cloudfirestore-aggregate-query --firestore-emulator
          lane firestore-filters --runtime-drift-case cloudfirestore-query-filters --firestore-emulator
      - name: Collect validation evidence
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
          PACKAGE_INSPECTION_OUTCOME: ${{ steps.package-inspection.outcome }}
        run: python3 scripts/firebase-release/release.py collect_validation --results-dir output/firebase-results
      - name: Seal candidate and write approval summary
        run: python3 scripts/firebase-release/release.py finalize --results output/firebase-results/validation.json
      - name: Upload validated candidate
        uses: actions/upload-artifact@v6
        with:
          name: firebase-candidate
          path: output/firebase-candidate
          if-no-files-found: error
          retention-days: 90
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firebase-validation-results
          path: |
            output/firebase-results
            tests/E2E/Firebase.Foundation/artifacts/*.log
            tests/E2E/Firebase.Foundation/artifacts/*.json
            tests/E2E/Firebase.Foundation/artifacts/firestore-emulator/**/*.log
          retention-days: 90

  validation:
    name: Firebase validation
    if: always()
    needs: [plan, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEVANT: ${{ needs.plan.outputs.relevant }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$RELEVANT" = true ] && [ "$EVENT_NAME" != pull_request ]; then
            test "$VALIDATE_RESULT" = success
          elif [ "$RELEVANT" = true ]; then
            test "$VALIDATE_RESULT" = skipped
            echo '::notice::Firebase native validation is required and runs after merge on main. To run it before merging, manually run this workflow on the branch.'
          else
            test "$VALIDATE_RESULT" = skipped
            echo 'No Firebase package or validation inputs changed.'
          fi

  publish:
    needs: [plan, validation]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.plan.outputs.eligible == 'true' && needs.validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: firebase-release
    concurrency:
      group: firebase-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v7
        with:
          name: firebase-candidate
          path: output/firebase-candidate
      - name: Re-export allowed package scope
        run: |
          dotnet tool restore
          dotnet tool run dotnet-cake -- --target=firebase-publish-metadata
      - name: Configure authenticated GitHub Packages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --name firebase-github --username "$GITHUB_ACTOR" --password "$GH_TOKEN" \
            --store-password-in-clear-text
      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish approved packages and create release
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 scripts/firebase-release/release.py publish

  signin-plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      relevant: ${{ steps.plan.outputs.relevant }}
      eligible: ${{ steps.plan.outputs.eligible }}
      runner: ${{ steps.plan.outputs.runner }}
      xcode: ${{ steps.plan.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Export Sign-In and integration dependency closures
        run: |
          dotnet tool run dotnet-cake -- signin_publish.cake
          dotnet tool run dotnet-cake -- --target=firebase-publish-metadata
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests/firebase-release -v
      - name: Plan Sign-In validation and release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          args=(--online)
          if [[ "$EVENT_NAME" == push ]]; then
            # Compare with the last commit that passed validation, so a failed run stays in range.
            BASE_SHA=$(python3 scripts/firebase-release/release.py --channel signin last-validated)
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            args+=(--manual)
          elif [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/firebase-release/release.py --channel signin plan "${args[@]}"
      - name: Preflight Sign-In feeds
        if: steps.plan.outputs.eligible == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/firebase-release/release.py --channel signin check-feeds
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signin-plan
          path: |
            output/signin-plan.json
            output/signin-metadata.json
            output/signin-feed-check.json
          if-no-files-found: error
          retention-days: 90

  signin-validate:
    needs: signin-plan
    if: needs.signin-plan.outputs.relevant == 'true' && github.event_name != 'pull_request'
    # Native builds run only on the maintainers' self-hosted Mac (docs/SELF_HOSTED_MACOS_RUNNER.md).
    runs-on: [self-hosted, macOS, ARM64, '${{ needs.signin-plan.outputs.runner }}']
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      BUILD_COMMIT: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      XCODE_VERSION: ${{ needs.signin-plan.outputs.xcode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: signin-plan
          path: output
      - name: Select configured Xcode
        run: tools/ci/select-xcode.sh "$XCODE_VERSION"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned producer tools
        run: |
          dotnet tool restore
          dotnet workload install ios maccatalyst
          pin=$(python3 -c 'import json; print(json.load(open("eng/signin-release.json"))["nativeBuild"]["cocoapods"])')
          # Install the pinned CocoaPods into a job-local gem home so the Mac's own gems are untouched.
          export GEM_HOME="$RUNNER_TEMP/gems"
          gem install cocoapods --version "$pin" --no-document
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "$GEM_HOME/bin" >> "$GITHUB_PATH"
          test "$("$GEM_HOME/bin/pod" --version)" = "$pin"
      - name: Unit tests
        id: unit-tests
        run: python3 -m unittest discover -s tests/firebase-release -v
      - name: Build and pack Sign-In closure
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Google.SignIn
      - name: Inspect and stage Sign-In candidate
        id: package-inspection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/firebase-release/release.py --channel signin prepare --online
          python3 scripts/signin-release/validate.py
      - name: Standalone and transitive offline consumers
        run: python3 scripts/signin-release/consumers.py
      - name: Reuse published Firebase 12 integration fixtures
        id: fixtures
        env:
          # GitHub Packages reads need a repository token; fork pull requests use nuget.org alone.
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.token || '' }}
        run: |
          dotnet tool run dotnet-cake -- --target=firebase-publish-metadata
          python3 scripts/signin-release/integration_feed.py --fetch-published
      - name: Build Firebase 12 integration fixtures only
        if: steps.fixtures.outputs.source != 'published'
        run: dotnet tool run dotnet-cake -- --target=nuget --names=Firebase.Auth,Firebase.Analytics,Firebase.CloudFirestore
      - name: Stage Firebase 12 integration feed
        run: python3 scripts/signin-release/integration_feed.py
      - name: Combined Sign-In and Firebase 12 consumers
        run: python3 scripts/signin-release/consumers.py --feed output/signin-combined --combined
      - name: Seal Sign-In validation evidence and approval summary
        env:
          UNIT_TEST_OUTCOME: ${{ steps.unit-tests.outcome }}
          PACKAGE_INSPECTION_OUTCOME: ${{ steps.package-inspection.outcome }}
        run: |
          python3 scripts/firebase-release/release.py --channel signin collect_validation --results-dir output/signin-results
          python3 scripts/firebase-release/release.py --channel signin finalize --results output/signin-results/validation.json
      - uses: actions/upload-artifact@v6
        with:
          name: signin-candidate
          path: output/signin-candidate
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: signin-validation-results
          path: |
            output/signin-results
            output/signin-resolution
          retention-days: 90

  signin-validation:
    name: Google Sign-In validation
    if: always()
    needs: [signin-plan, signin-validate]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN_RESULT: ${{ needs.signin-plan.result }}
          RELEVANT: ${{ needs.signin-plan.outputs.relevant }}
          VALIDATE_RESULT: ${{ needs.signin-validate.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$RELEVANT" = true ] && [ "$EVENT_NAME" != pull_request ]; then
            test "$VALIDATE_RESULT" = success
          elif [ "$RELEVANT" = true ]; then
            test "$VALIDATE_RESULT" = skipped
            echo '::notice::Sign-In native validation is required and runs after merge on main. To run it before merging, manually run this workflow on the branch.'
          else
            test "$VALIDATE_RESULT" = skipped
            echo 'No Sign-In package or validation inputs changed.'
          fi

  signin-publish:
    needs: [signin-plan, signin-validation]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.signin-plan.outputs.eligible == 'true' && needs.signin-validation.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: firebase-release
    concurrency:
      group: firebase-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v7
        with:
          name: signin-candidate
          path: output/signin-candidate
      - name: Re-export allowed Sign-In scope
        run: |
          dotnet tool restore
          dotnet tool run dotnet-cake -- signin_publish.cake
      - name: Configure authenticated GitHub Packages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" \
            --name signin-github --username "$GITHUB_ACTOR" --password "$GH_TOKEN" \
            --store-password-in-clear-text
      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish approved Sign-In artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: python3 scripts/firebase-release/release.py --channel signin publish
